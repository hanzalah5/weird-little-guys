/* =========================================================================
   Codec — guys and race ghosts packed into short copy-pasteable codes.
   Format: "WLG" + kind + "." + base64(bytes)  (kind: g = guy, r = race ghost)
   ========================================================================= */
const Codec = (() => {
  const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  const enc = new TextEncoder(), dec = new TextDecoder();

  class W {
    constructor() { this.b = []; }
    u8(v) { this.b.push(v & 255); }
    vu(v) { v = Math.max(0, Math.floor(v)); while (v >= 128) { this.b.push((v & 127) | 128); v = Math.floor(v / 128); } this.b.push(v); }
    vs(v) { this.vu(v < 0 ? -2 * v - 1 : 2 * v); }
    u32(v) { this.u8(v); this.u8(v >>> 8); this.u8(v >>> 16); this.u8(v >>> 24); }
    str(s) { const x = enc.encode(s || '').slice(0, 60); this.vu(x.length); for (const c of x) this.b.push(c); }
    bytes() { return new Uint8Array(this.b); }
  }
  class R {
    constructor(b) { this.b = b; this.p = 0; }
    u8() { if (this.p >= this.b.length) throw new Error('eof'); return this.b[this.p++]; }
    vu() { let v = 0, m = 1, c; do { c = this.u8(); v += (c & 127) * m; m *= 128; } while (c & 128 && m < 2 ** 49); return v; }
    vs() { const v = this.vu(); return v & 1 ? -(v + 1) / 2 : v / 2; }
    u32() { return (this.u8() | (this.u8() << 8) | (this.u8() << 16) | (this.u8() << 24)) >>> 0; }
    str() { const n = this.vu(); if (n > 200) throw new Error('bad str'); const s = this.b.slice(this.p, this.p + n); this.p += n; return dec.decode(s); }
  }

  function writeGuy(w, rec) {
    w.u8(1); // version
    w.u8(((LEG_OPTIONS.indexOf(rec.legs) & 7) << 5) | ((rec.arms ? 1 : 0) << 4) | (rec.color & 15));
    w.u8(rec.look);
    w.u32(rec.seed);
    w.vu(rec.born);
    w.str(rec.name);
    w.str(rec.by);
    w.vu(rec.strokes.length);
    for (const s of rec.strokes) {
      const n = s.length / 2;
      w.vu(n);
      let px = 0, py = 0;
      for (let i = 0; i < s.length; i += 2) {
        const qx = Math.round(s[i] / 2), qy = Math.round(s[i + 1] / 2);
        if (i === 0) { w.vu(qx); w.vu(qy); } else { w.vs(qx - px); w.vs(qy - py); }
        px = qx; py = qy;
      }
    }
  }
  function readGuy(r) {
    const ver = r.u8();
    if (ver !== 1) throw new Error('version');
    const f = r.u8();
    const rec = { legs: LEG_OPTIONS[(f >> 5) & 7] ?? 2, arms: (f >> 4) & 1, color: clamp(f & 15, 0, COLORS.length - 1) };
    rec.look = r.u8();
    rec.seed = r.u32();
    rec.born = r.vu();
    rec.name = r.str().slice(0, 24) || 'Guy';
    rec.by = r.str().slice(0, 20);
    const ns = r.vu();
    if (ns > 2000) throw new Error('too many strokes');
    rec.strokes = [];
    for (let k = 0; k < ns; k++) {
      const n = r.vu();
      if (n > 5000) throw new Error('too many points');
      const s = [];
      let x = 0, y = 0;
      for (let i = 0; i < n; i++) {
        if (i === 0) { x = r.vu(); y = r.vu(); } else { x += r.vs(); y += r.vs(); }
        s.push(clamp(x * 2, 0, DRAW), clamp(y * 2, 0, DRAW));
      }
      rec.strokes.push(s);
    }
    rec.id = 'g' + (hashString(rec.strokes.map((s) => s.join(',')).join('|') + rec.seed).toString(36));
    return rec;
  }

  function b64(bytes) {
    let out = '';
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i], b = bytes[i + 1], c = bytes[i + 2];
      const n = (a << 16) | ((b || 0) << 8) | (c || 0);
      out += B64[(n >> 18) & 63] + B64[(n >> 12) & 63] + (i + 1 < bytes.length ? B64[(n >> 6) & 63] : '') + (i + 2 < bytes.length ? B64[n & 63] : '');
    }
    return out;
  }
  function unb64(str) {
    const clean = str.replace(/[^A-Za-z0-9+/]/g, '');
    const out = [];
    for (let i = 0; i < clean.length; i += 4) {
      const v = [0, 1, 2, 3].map((k) => (i + k < clean.length ? B64.indexOf(clean[i + k]) : -1));
      const n = (v[0] << 18) | (v[1] << 12) | ((v[2] < 0 ? 0 : v[2]) << 6) | (v[3] < 0 ? 0 : v[3]);
      out.push((n >> 16) & 255);
      if (v[2] >= 0) out.push((n >> 8) & 255);
      if (v[3] >= 0) out.push(n & 255);
    }
    return new Uint8Array(out);
  }

  function guyCode(rec) { const w = new W(); writeGuy(w, rec); return 'WLGg.' + b64(w.bytes()); }
  function raceCode(rec, ghost) {
    const w = new W();
    writeGuy(w, rec);
    w.vu(ghost.day); w.vu(ghost.ms); w.vu(ghost.inputs.length / 2);
    let prev = 0;
    for (let i = 0; i < ghost.inputs.length; i += 2) { w.vu(ghost.inputs[i] - prev); w.vu(ghost.inputs[i + 1]); prev = ghost.inputs[i]; }
    return 'WLGr.' + b64(w.bytes());
  }
  /* accepts a bare code, a link with #g=/#r=, or text that contains a code */
  function parse(text) {
    if (!text) return null;
    const t = String(text).replace(/\s+/g, '');
    try {
      let m = t.match(/WLG([gr])\.([A-Za-z0-9+/]+)/);
      if (!m) { const h = t.match(/#([gr])=([A-Za-z0-9+/%]+)/); if (h) m = [0, h[1], decodeURIComponent(h[2])]; }
      if (!m) return null;
      const r = new R(unb64(m[2]));
      const rec = readGuy(r);
      if (!rec.strokes.length || !buildGuy(rec)) return null;
      if (m[1] === 'g') return { kind: 'guy', rec };
      const day = r.vu(), ms = r.vu(), n = r.vu();
      if (n > 3000) return null;
      const inputs = [];
      let prev = 0;
      for (let i = 0; i < n; i++) { const f = prev + r.vu(); inputs.push(f, r.vu()); prev = f; }
      return { kind: 'race', rec, ghost: { day, ms, inputs } };
    } catch (e) { return null; }
  }
  function shareLink(code) {
    if (inArtifactViewer || location.protocol === 'file:') return null;
    const kind = code[3], body = code.slice(5);
    return location.href.split('#')[0] + '#' + kind + '=' + body;
  }
  return { guyCode, raceCode, parse, shareLink };
})();

// ---- 04-render.js
/* =========================================================================
   Guy renderer — line boil, rubber-hose limbs, googly eyes, expressions
   ========================================================================= */
const BOIL_FRAMES = 3;
const FONT = '"Shantell Sans","Comic Sans MS","Chalkboard SE","Marker Felt",system-ui,sans-serif';

function ensurePaths(g) {
  if (g.paths) return g.paths;
  const ox = g.originX, oy = g.originY, seed = g.rec.seed & 0xffff;
  const amp = reducedMotion ? 0 : 2.6;
  const fills = [], inks = [];
  for (let f = 0; f < BOIL_FRAMES; f++) {
    const fp = new Path2D();
    g.A.contours.forEach((pts, ci) => {
      for (let i = 0; i < pts.length; i++) {
        const nx = noise1(i * 0.22 + ci * 17, seed + f * 101) * amp, ny = noise1(i * 0.22 + ci * 17 + 50, seed + f * 101) * amp;
        const x = pts[i][0] - ox + nx, y = pts[i][1] - oy + ny;
        if (i) fp.lineTo(x, y); else fp.moveTo(x, y);
      }
      fp.closePath();
    });
    fills.push(fp);
    const ip = new Path2D();
    g.rec.strokes.forEach((s, si) => {
      const n = s.length / 2;
      const P = (i) => [
        s[i * 2] - ox + noise1(i * 0.3 + si * 13, seed + f * 77 + 5) * amp,
        s[i * 2 + 1] - oy + noise1(i * 0.3 + si * 13 + 40, seed + f * 77 + 5) * amp,
      ];
      const p0 = P(0);
      ip.moveTo(p0[0], p0[1]);
      if (n === 1) { ip.lineTo(p0[0] + 0.01, p0[1]); return; }
      if (n === 2) { const p1 = P(1); ip.lineTo(p1[0], p1[1]); return; }
      let prev = P(1);
      for (let i = 1; i < n - 1; i++) {
        const nxt = P(i + 1);
        ip.quadraticCurveTo(prev[0], prev[1], (prev[0] + nxt[0]) / 2, (prev[1] + nxt[1]) / 2);
        prev = nxt;
      }
      ip.lineTo(prev[0], prev[1]);
    });
    inks.push(ip);
  }
  g.paths = { fills, inks };
  return g.paths;
}

function makePose() {
  return {
    phase: Math.random() * TAU, walk: 0, face: 1,
    lookX: 0, lookY: 0, pupils: null, accX: 0, accY: 0,
    blink: 0, blinkT: rand.range(0.5, 4), blinkAnim: -1,
    squash: 0, squashV: 0, tilt: 0, spin: 0, lift: 0, airH: 0,
    air: false, flail: 0,
    expr: 'normal', exprT: 0, talkT: 0, talk: 0,
    armMode: 'rest', legGrow: 1, eyePop: 1,
  };
}

function setExpr(P, expr, secs) { P.expr = expr; P.exprT = secs || 0; }

/* generic per-frame animation: blinks, springs, pupils, mouth */
function animatePose(g, P, dt, t) {
  // blink
  P.blinkT -= dt;
  if (P.blinkAnim < 0 && P.blinkT <= 0) { P.blinkAnim = 0; P.blinkT = rand.chance(0.15) ? 0.25 : rand.range(2, 6); }
  if (P.blinkAnim >= 0) {
    P.blinkAnim += dt / 0.16;
    P.blink = P.blinkAnim < 0.5 ? P.blinkAnim * 2 : 2 - P.blinkAnim * 2;
    if (P.blinkAnim >= 1) { P.blinkAnim = -1; P.blink = 0; }
  }
  // squash spring
  const k = 170, c = 11;
  P.squashV += (-k * P.squash - c * P.squashV) * dt;
  P.squash = clamp(P.squash + P.squashV * dt, -0.45, 0.5);
  // expression timer
  if (P.exprT > 0) { P.exprT -= dt; if (P.exprT <= 0 && P.expr !== 'sleep') P.expr = 'normal'; }
  // talking mouth
  if (P.talkT > 0) { P.talkT -= dt; P.talk = Math.abs(Math.sin(t * 21)) * 0.9 + 0.1; } else P.talk = damp(P.talk, 0, 12, dt);
  // googly pupils
  if (!P.pupils || P.pupils.length !== g.eyes.length) P.pupils = g.eyes.map(() => ({ x: 0, y: 0, vx: 0, vy: 0 }));
  const m = 1 - g.pupil * 0.92;
  for (const p of P.pupils) {
    const tx = clamp(P.lookX, -1, 1) * m * 0.85, ty = clamp(P.lookY, -1, 1) * m * 0.85 + 0.12 * m;
    p.vx += ((tx - p.x) * 38 - p.vx * 5.5 - P.accX * 0.0035) * dt;
    p.vy += ((ty - p.y) * 38 - p.vy * 5.5 - P.accY * 0.0035 + (P.air ? 6 : 0)) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.hypot(p.x, p.y);
    if (d > m) {
      const nx = p.x / d, ny = p.y / d;
      p.x = nx * m; p.y = ny * m;
      const vn = p.vx * nx + p.vy * ny;
      if (vn > 0) { p.vx -= 1.5 * vn * nx; p.vy -= 1.5 * vn * ny; }
    }
  }
}

function limb(ctx, hx, hy, fx, fy, L, bend) {
  let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 0.001;
  if (d > L * 0.995) { const kk = (L * 0.995) / d; dx *= kk; dy *= kk; fx = hx + dx; fy = hy + dy; d = L * 0.995; }
  const a = L / 2, ht = Math.sqrt(Math.max(0, a * a - (d * d) / 4));
  const mx = (hx + fx) / 2, my = (hy + fy) / 2;
  let px = -dy / d, py = dx / d;
  if (px * bend < 0 || (Math.abs(px) < 1e-3 && py > 0)) { px = -px; py = -py; }
  const kx = mx + px * ht, ky = my + py * ht;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.quadraticCurveTo(2 * kx - mx, 2 * ky - my, fx, fy);
  return [fx, fy];
}

function strokeLimb(ctx, g, lw, chunky) {
  if (chunky) {
    ctx.strokeStyle = INK; ctx.lineWidth = lw * 2.5; ctx.stroke();
    ctx.strokeStyle = g.fill; ctx.lineWidth = lw * 1.25; ctx.stroke();
  } else {
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }
}

function drawFoot(ctx, g, fx, fy, L, face, lw) {
  const fl = clamp(L * 0.36, 11, 30), fh = fl * 0.56;
  ctx.lineWidth = lw * 0.7; ctx.strokeStyle = INK;
  if (g.footStyle === 'shoe') {
    ctx.fillStyle = g.shoe;
    ctx.beginPath(); ctx.ellipse(fx + face * fl * 0.3, fy - fh * 0.42, fl * 0.58, fh * 0.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
  } else if (g.footStyle === 'round') {
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(fx + face * fl * 0.12, fy - fl * 0.2, fl * 0.28, 0, TAU); ctx.fill();
  } else if (g.footStyle === 'toes') {
    ctx.beginPath();
    for (const a of [-0.5, 0, 0.5]) { ctx.moveTo(fx, fy - 1); ctx.lineTo(fx + face * Math.cos(a) * fl * 0.6, fy - 1 + Math.sin(a) * fl * 0.25); }
    ctx.lineWidth = lw * 0.8; ctx.stroke();
  }
}

/*
 * Draw a guy standing on screen point (x, y) at scale s (px per drawing unit).
 */
function drawGuy(ctx, g, x, y, s, P, t, opts) {
  opts = opts || {};
  const paths = ensurePaths(g);
  const frame = reducedMotion ? 0 : ((((Math.floor(t * 8) + (g.rec.seed & 3)) % BOIL_FRAMES) + BOIL_FRAMES) % BOIL_FRAMES) || 0;
  const lw = Math.max(INK_W, 1.7 / s);
  ctx.save();
  ctx.translate(x, y);
  if (opts.alpha != null) ctx.globalAlpha *= opts.alpha;
  if (opts.shadow !== false) {
    const sw = Math.max(g.bodyW * 0.48, 30) * s * clamp(1 - P.airH / 320, 0.35, 1);
    ctx.fillStyle = 'rgba(30,27,54,0.15)';
    ctx.beginPath(); ctx.ellipse(0, 0, sw, Math.max(3, sw * 0.17), 0, 0, TAU); ctx.fill();
  }
  if (opts.selected) {
    ctx.save();
    ctx.setLineDash([6, 6]); ctx.lineDashOffset = -t * 20;
    ctx.strokeStyle = 'rgba(30,27,54,0.65)'; ctx.lineWidth = 2.5;
    const sw = Math.max(g.bodyW * 0.62, 40) * s;
    ctx.beginPath(); ctx.ellipse(0, 0, sw, Math.max(6, sw * 0.24), 0, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  ctx.translate(0, -P.airH);
  ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  const legLen = g.legLen * P.legGrow;
  const bodyY = -legLen - P.lift;
  const pivotY = bodyY + g.bodyMidY;
  const rot = P.tilt + P.spin;
  const sq = P.squash + (P.extraSq || 0), sx = 1 + sq * 0.55, sy = 1 - sq;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const T = (bx, by) => {
    const px = bx * sx, py = by * sy + bodyY - pivotY;
    return [px * cr - py * sr, pivotY + px * sr + py * cr];
  };

  // ---- legs (behind the body)
  if (g.legs.length && P.legGrow > 0.02) {
    const S = g.stride;
    for (const leg of g.legs) {
      const [hx, hy] = T(leg.hx, leg.hy);
      const L = leg.len * P.legGrow;
      let fx, fy;
      if (P.air) {
        const w = Math.sin(t * 19 + leg.hx * 0.13) * L * 0.28 * P.flail;
        fx = hx + w + P.face * L * 0.08;
        fy = hy + L * 0.86;
      } else {
        const u = (((P.phase + leg.group * Math.PI + leg.off) / TAU) % 1 + 1) % 1;
        let rel, lift = 0;
        if (u < 0.5) rel = S / 2 - (u / 0.5) * S;
        else { const v = (u - 0.5) / 0.5; rel = -S / 2 + smooth(v) * S; lift = Math.sin(v * Math.PI) * S * 0.38; }
        fx = leg.hx + rel * P.walk;
        fy = -lift * P.walk;
      }
      const [ffx, ffy] = limb(ctx, hx, hy, fx, fy, L, P.face);
      strokeLimb(ctx, g, lw, g.legStyle === 'chunky');
      drawFoot(ctx, g, ffx, ffy, L, P.face, lw);
    }
  }

  // ---- arms (behind the body)
  if (g.arms.length) {
    for (const arm of g.arms) {
      const [shx, shy] = T(arm.sx, arm.sy);
      const L = arm.len * P.legGrow, sd = arm.side;
      let hx, hy;
      const mode = P.armMode;
      if (P.air || mode === 'flail') {
        hx = shx + sd * L * 0.55 + Math.sin(t * 21 + sd * 2) * L * 0.3;
        hy = shy - L * 0.45 + Math.cos(t * 17 + sd) * L * 0.3;
      } else if (mode === 'cheer') {
        hx = shx + sd * L * 0.42; hy = shy - L * 0.85 + Math.sin(t * 14 + sd) * L * 0.1;
      } else if (mode === 'wave' && sd === (P.waveSide || 1)) {
        hx = shx + sd * L * 0.45 + Math.sin(t * 13) * L * 0.28; hy = shy - L * 0.75;
      } else if (mode === 'run') {
        const sw = Math.sin(P.phase + (sd > 0 ? 0 : Math.PI));
        hx = shx + sd * L * 0.25 + sw * L * 0.45 * P.face; hy = shy + L * 0.55 - Math.abs(sw) * L * 0.2;
      } else if (mode === 'dance') {
        const sw = Math.sin(t * 9 + (sd > 0 ? 0 : Math.PI));
        hx = shx + sd * L * 0.55; hy = shy - L * 0.2 + sw * L * 0.55;
      } else {
        const sway = Math.sin(t * 2.1 + sd) * L * 0.06 + Math.sin(P.phase + (sd > 0 ? 0 : Math.PI)) * L * 0.25 * P.walk * P.face;
        hx = shx + sd * L * 0.42 + sway; hy = shy + L * 0.78;
      }
      const [ex, ey] = limb(ctx, shx, shy, hx, hy, L, sd);
      strokeLimb(ctx, g, lw * 0.9, g.legStyle === 'chunky');
      const hr = clamp(L * 0.13, 5, 12);
      ctx.fillStyle = g.fill; ctx.lineWidth = lw * 0.7; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.arc(ex, ey, hr, 0, TAU); ctx.fill(); ctx.stroke();
    }
  }

  // ---- body
  ctx.save();
  ctx.translate(0, pivotY); ctx.rotate(rot); ctx.translate(0, bodyY - pivotY); ctx.scale(sx, sy);
  ctx.fillStyle = g.fill;
  ctx.fill(paths.fills[frame]);
  ctx.save();
  ctx.clip(paths.fills[frame]);
  ctx.fillStyle = 'rgba(30,27,54,0.12)';
  ctx.beginPath(); ctx.ellipse(g.bodyW * 0.14, 0, g.bodyW * 0.7, g.bodyH * 0.32, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath(); ctx.ellipse(-g.bodyW * 0.22, g.bodyTop + g.bodyH * 0.2, g.bodyW * 0.13, g.bodyH * 0.08, -0.5, 0, TAU); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = lw;
  ctx.stroke(paths.inks[frame]);

  // ---- face
  drawFace(ctx, g, P, t, lw);
  if (opts.crown || g.rec.crown) drawCrown(ctx, g, lw, t);
  ctx.restore();
  ctx.restore();
}

function drawFace(ctx, g, P, t, lw) {
  const expr = P.expr;
  // stalks
  for (const st of g.stalks) {
    ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.9;
    ctx.beginPath(); ctx.moveTo(st.bx, st.by);
    ctx.quadraticCurveTo(st.bx, (st.by + st.ey) / 2, st.ex, st.ey + 2); ctx.stroke();
  }
  // cheeks
  if (g.cheeks && g.mouth) {
    ctx.fillStyle = expr === 'happy' || expr === 'win' ? 'rgba(255,80,130,0.55)' : 'rgba(255,96,140,0.38)';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(g.mouth.x + sd * g.cheeks.dx, g.cheeks.y, g.cheeks.r, g.cheeks.r * 0.62, 0, 0, TAU); ctx.fill(); }
  }
  // eyes
  const pop = P.eyePop;
  for (let i = 0; i < g.eyes.length; i++) {
    const e = g.eyes[i];
    const r = e.r * (pop < 1 ? easeOutBack(clamp(pop, 0, 1)) : 1) * (expr === 'surprised' ? 1.12 : 1);
    if (r < 0.6) continue;
    ctx.lineWidth = lw * 0.75; ctx.strokeStyle = INK;
    if (expr === 'sleep') {
      ctx.beginPath(); ctx.arc(e.x, e.y - r * 0.15, r * 0.62, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
      continue;
    }
    if (expr === 'happy' || expr === 'win') {
      ctx.lineWidth = lw * 0.95;
      ctx.beginPath(); ctx.arc(e.x, e.y + r * 0.35, r * 0.62, 1.12 * Math.PI, 1.88 * Math.PI); ctx.stroke();
      continue;
    }
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.fill(); ctx.stroke();
    const pp = (P.pupils && P.pupils[i]) || { x: 0, y: 0 };
    const pr = r * g.pupil * (expr === 'surprised' ? 0.62 : 1);
    if (expr === 'dizzy') {
      ctx.lineWidth = lw * 0.6;
      ctx.beginPath();
      for (let a = 0; a < 14; a++) { const ang = a * 0.75 + t * 9 * (i % 2 ? -1 : 1), rad = (a / 14) * r * 0.75; const px = e.x + Math.cos(ang) * rad, py = e.y + Math.sin(ang) * rad; if (a) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.stroke();
    } else {
      const px = e.x + pp.x * r, py = e.y + pp.y * r;
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.38, pr * 0.3, 0, TAU); ctx.fill();
    }
    // lids: blink / sleepy variants / determined
    let lid = P.blink;
    if (g.sleepyLids && expr === 'normal') lid = Math.max(lid, 0.36);
    if (expr === 'tired') lid = Math.max(lid, 0.5);
    if (lid > 0.01) {
      ctx.save();
      ctx.beginPath(); ctx.arc(e.x, e.y, r + lw * 0.2, 0, TAU); ctx.clip();
      ctx.fillStyle = g.fill;
      const ly = e.y - r + 2 * r * lid;
      ctx.fillRect(e.x - r - lw, e.y - r - lw, 2 * r + 2 * lw, ly - (e.y - r - lw));
      ctx.restore();
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, TAU); ctx.lineWidth = lw * 0.75; ctx.stroke();
      if (lid < 0.97) { ctx.beginPath(); const hw = Math.sqrt(Math.max(0, r * r - (ly - e.y) ** 2)); ctx.moveTo(e.x - hw, ly); ctx.lineTo(e.x + hw, ly); ctx.stroke(); }
    }
    if (g.lashes && lid < 0.5) {
      ctx.lineWidth = lw * 0.6;
      ctx.beginPath();
      for (const a of [-0.55, -0.25, 0.05]) { const ang = -Math.PI / 2 + a + (i % 2 ? 0.25 : -0.25); ctx.moveTo(e.x + Math.cos(ang) * r, e.y + Math.sin(ang) * r); ctx.lineTo(e.x + Math.cos(ang) * r * 1.35, e.y + Math.sin(ang) * r * 1.35); }
      ctx.stroke();
    }
    if (expr === 'determined' || expr === 'angry') {
      const sd = g.eyes.length > 1 ? (e.x < (g.eyes[0].x + g.eyes[1].x) / 2 ? -1 : 1) : 1;
      ctx.lineWidth = lw * 1.05;
      ctx.beginPath();
      ctx.moveTo(e.x - r * 0.95, e.y - r * (sd < 0 ? 1.45 : 1.08));
      ctx.lineTo(e.x + r * 0.95, e.y - r * (sd < 0 ? 1.08 : 1.45));
      ctx.stroke();
    }
    if (expr === 'sad') {
      ctx.lineWidth = lw * 0.9;
      ctx.beginPath(); ctx.moveTo(e.x - r * 0.9, e.y - r * 1.15); ctx.lineTo(e.x + r * 0.9, e.y - r * 1.4); ctx.stroke();
    }
  }
  // mouth
  const m = g.mouth;
  if (!m) return;
  const w = m.w, mx = m.x, my = m.y;
  let type = m.type;
  if (expr === 'happy' || expr === 'win') type = 'grin';
  else if (expr === 'surprised' || expr === 'held') type = 'o';
  else if (expr === 'sleep') type = 'snore';
  else if (expr === 'dizzy') type = 'wavy';
  else if (expr === 'sad') type = 'frown';
  else if (expr === 'eat') type = 'chew';
  else if (expr === 'determined') type = 'flat';
  ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.8;
  const MOUTH = '#5C1A33', TONGUE = '#FF7A9C';
  if (P.talk > 0.15 && type !== 'snore') {
    const oh = w * 0.42 * P.talk + 2;
    ctx.fillStyle = MOUTH;
    ctx.beginPath(); ctx.ellipse(mx, my + oh * 0.3, w * 0.36, oh * 0.6, 0, 0, TAU); ctx.fill(); ctx.stroke();
    return;
  }
  ctx.beginPath();
  switch (type) {
    case 'grin': case 'teeth': {
      ctx.moveTo(mx - w / 2, my - w * 0.06);
      ctx.lineTo(mx + w / 2, my - w * 0.06);
      ctx.quadraticCurveTo(mx, my + w * 0.78, mx - w / 2, my - w * 0.06);
      ctx.fillStyle = MOUTH; ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = TONGUE; ctx.beginPath(); ctx.ellipse(mx, my + w * 0.36, w * 0.24, w * 0.15, 0, 0, TAU); ctx.fill();
      if (type === 'teeth') { ctx.fillStyle = '#fff'; ctx.fillRect(mx - w * 0.3, my - w * 0.07, w * 0.6, w * 0.13); }
      ctx.restore();
      ctx.beginPath(); ctx.moveTo(mx - w / 2, my - w * 0.06); ctx.lineTo(mx + w / 2, my - w * 0.06); ctx.quadraticCurveTo(mx, my + w * 0.78, mx - w / 2, my - w * 0.06);
      ctx.stroke();
      return;
    }
    case 'o': case 'snore': {
      const k = type === 'snore' ? 0.7 + Math.sin(t * 2) * 0.25 : 1;
      ctx.ellipse(mx, my + w * 0.1, w * 0.17 * k, w * 0.22 * k, 0, 0, TAU);
      ctx.fillStyle = MOUTH; ctx.fill(); ctx.stroke();
      return;
    }
    case 'cat':
      ctx.moveTo(mx - w / 2, my); ctx.quadraticCurveTo(mx - w / 4, my + w * 0.38, mx, my);
      ctx.quadraticCurveTo(mx + w / 4, my + w * 0.38, mx + w / 2, my); ctx.stroke(); return;
    case 'flat':
      ctx.moveTo(mx - w * 0.4, my + w * 0.08); ctx.quadraticCurveTo(mx, my + w * 0.02, mx + w * 0.4, my + w * 0.1); ctx.stroke(); return;
    case 'frown':
      ctx.moveTo(mx - w * 0.4, my + w * 0.25); ctx.quadraticCurveTo(mx, my - w * 0.12, mx + w * 0.4, my + w * 0.25); ctx.stroke(); return;
    case 'wavy':
      ctx.moveTo(mx - w * 0.45, my + w * 0.1);
      for (let i = 1; i <= 6; i++) ctx.lineTo(mx - w * 0.45 + (i / 6) * w * 0.9, my + w * 0.1 + (i % 2 ? -1 : 1) * w * 0.08);
      ctx.stroke(); return;
    case 'chew': {
      const o = Math.abs(Math.sin(t * 14));
      ctx.ellipse(mx, my + w * 0.08, w * 0.3, w * 0.06 + w * 0.16 * o, 0, 0, TAU);
      ctx.fillStyle = MOUTH; ctx.fill(); ctx.stroke(); return;
    }
    default: { // smile, fang, tongue
      ctx.moveTo(mx - w / 2, my);
      ctx.quadraticCurveTo(mx, my + w * 0.5, mx + w / 2, my);
      ctx.stroke();
      if (type === 'fang') {
        ctx.fillStyle = '#fff'; ctx.beginPath();
        ctx.moveTo(mx + w * 0.12, my + w * 0.2); ctx.lineTo(mx + w * 0.26, my + w * 0.17); ctx.lineTo(mx + w * 0.2, my + w * 0.36); ctx.closePath();
        ctx.fill(); ctx.lineWidth = lw * 0.5; ctx.stroke();
      } else if (type === 'tongue') {
        ctx.fillStyle = TONGUE; ctx.beginPath();
        ctx.moveTo(mx + w * 0.02, my + w * 0.24);
        ctx.quadraticCurveTo(mx + w * 0.16, my + w * 0.6, mx + w * 0.3, my + w * 0.18);
        ctx.fill(); ctx.lineWidth = lw * 0.6; ctx.stroke();
      }
    }
  }
}

function drawCrown(ctx, g, lw, t) {
  const w = clamp(g.bodyW * 0.36, 34, 90), hgt = w * 0.55;
  let topY = g.bodyTop - 2;
  for (const e of g.eyes) topY = Math.min(topY, e.y - e.r - 4);
  const x = 0, y = topY + hgt * 0.15;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.12 + Math.sin(t * 2) * 0.03);
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -hgt * 0.75); ctx.lineTo(-w / 4, -hgt * 0.35); ctx.lineTo(0, -hgt);
  ctx.lineTo(w / 4, -hgt * 0.35); ctx.lineTo(w / 2, -hgt * 0.75); ctx.lineTo(w / 2, 0); ctx.closePath();
  ctx.fillStyle = '#FFD23F'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = lw * 0.8; ctx.stroke();
  ctx.fillStyle = '#FF5B7F';
  ctx.beginPath(); ctx.arc(0, -hgt * 0.32, w * 0.07, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* portrait render into a canvas (cards, pickers) */
function renderPortrait(cv, g, opts = {}) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = cv.clientWidth || cv.width, H = cv.clientHeight || cv.height;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (opts.bg) {
    ctx.fillStyle = opts.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(30,27,54,0.07)'; ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += 16) { ctx.beginPath(); ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, H); ctx.stroke(); }
    for (let gy = 0; gy < H; gy += 16) { ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); ctx.stroke(); }
  }
  const pad = opts.pad != null ? opts.pad : 0.1;
  const fullW = g.halfW * 2 + 40, fullH = g.fullH + 30;
  const s = Math.min((W * (1 - pad * 2)) / fullW, (H * (1 - pad * 2)) / fullH);
  const P = opts.pose || makePose();
  if (!opts.pose) { P.pupils = g.eyes.map(() => ({ x: 0.05, y: 0.08 })); P.blinkT = 99; }
  const groundY = H / 2 + (g.fullH * s) / 2 + 2;
  drawGuy(ctx, g, W / 2, Math.min(groundY, H - 4), s, P, opts.t || 0, { shadow: opts.shadow !== false, crown: opts.crown });
  return s;
}

/* ---------------------------------------------------------------------
   Speech bubbles, name tags, particles
   --------------------------------------------------------------------- */
function roundRectPath(ctx, x, y, w, h2, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h2 - r); ctx.quadraticCurveTo(x + w, y + h2, x + w - r, y + h2);
  ctx.lineTo(x + r, y + h2); ctx.quadraticCurveTo(x, y + h2, x, y + h2 - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

function drawBubble(ctx, text, x, y, age, life, size = 16) {
  const appear = clamp(age / 0.18, 0, 1), vanish = clamp((life - age) / 0.25, 0, 1);
  const k = easeOutBack(appear) * vanish;
  if (k <= 0.01) return;
  ctx.save();
  ctx.font = `700 ${size}px ${FONT}`;
  const tw = ctx.measureText(text).width;
  const w = tw + size * 1.2, hh = size * 1.9;
  ctx.translate(x, y); ctx.scale(k, k); ctx.rotate(Math.sin(age * 3) * 0.03);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  roundRectPath(ctx, -w / 2, -hh - 10, w, hh, 12);
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-7, -11.5); ctx.lineTo(0, 0); ctx.lineTo(7, -11.5); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-7, -10); ctx.lineTo(0, 0); ctx.lineTo(7, -10); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, -hh / 2 - 9);
  ctx.restore();
}

function drawTag(ctx, text, x, y, alpha = 1, size = 13) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `800 ${size}px ${FONT}`;
  const w = ctx.measureText(text).width + 16;
  ctx.fillStyle = INK;
  roundRectPath(ctx, x - w / 2, y - 11, w, 22, 11); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 1);
  ctx.restore();
}

class Particles {
  constructor() { this.list = []; }
  add(p) {
    if (this.list.length > 400) this.list.shift();
    this.list.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, age: 0, size: 10, rot: 0, vr: 0, drag: 0 }, p));
  }
  burst(type, x, y, n, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = opts.angle != null ? opts.angle + rand.range(-opts.spread, opts.spread) : rand.range(0, TAU);
      const sp = rand.range(opts.speedMin || 60, opts.speed || 220);
      this.add(Object.assign({ type, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand.range(0.5, 1.1) * (opts.life || 1),
        size: rand.range(0.7, 1.3) * (opts.size || 10), rot: rand.range(0, TAU), vr: rand.range(-8, 8),
        color: opts.colors ? rand.pick(opts.colors) : opts.color, g: opts.g != null ? opts.g : 300, drag: opts.drag || 0, text: opts.text }, opts.extra || {}));
    }
  }
  update(dt) {
    for (const p of this.list) {
      p.age += dt;
      p.vy += p.g * dt;
      if (p.drag) { p.vx *= Math.exp(-p.drag * dt); p.vy *= Math.exp(-p.drag * dt); }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.floor != null && p.y > p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.7; p.vr *= 0.5; }
    }
    this.list = this.list.filter((p) => p.age < p.life);
  }
  draw(ctx) {
    for (const p of this.list) {
      const k = 1 - p.age / p.life;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size;
      switch (p.type) {
        case 'heart':
          ctx.fillStyle = p.color || '#FF5B7F'; ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(0, s * 0.35);
          ctx.bezierCurveTo(-s * 1.1, -s * 0.35, -s * 0.45, -s * 1.05, 0, -s * 0.45);
          ctx.bezierCurveTo(s * 0.45, -s * 1.05, s * 1.1, -s * 0.35, 0, s * 0.35);
          ctx.fill(); ctx.stroke(); break;
        case 'star':
          ctx.fillStyle = p.color || '#FFD23F'; ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) { const r = i % 2 ? s * 0.45 : s; const a = (i / 10) * TAU - Math.PI / 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
          ctx.closePath(); ctx.fill(); ctx.stroke(); break;
        case 'spark':
          ctx.fillStyle = p.color || '#fff'; ctx.beginPath();
          ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
          ctx.fill(); break;
        case 'dust':
          ctx.globalAlpha *= 0.55; ctx.fillStyle = p.color || '#fff'; ctx.strokeStyle = 'rgba(30,27,54,0.35)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(0, 0, s * (1.4 - k * 0.6), 0, TAU); ctx.fill(); ctx.stroke(); break;
        case 'confetti':
          ctx.fillStyle = p.color || '#FF82B8'; ctx.scale(1, Math.cos(p.age * 9 + p.vr));
          ctx.fillRect(-s * 0.5, -s * 0.28, s, s * 0.56); break;
        case 'drop':
          ctx.fillStyle = p.color || '#7FC8FF'; ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0, TAU); ctx.fill(); break;
        case 'text':
          ctx.rotate(-p.rot + Math.sin(p.age * 4) * 0.2);
          ctx.font = `800 ${s}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, 0, 0);
          ctx.fillStyle = p.color || INK; ctx.fillText(p.text, 0, 0); break;
        case 'crumb':
          ctx.fillStyle = p.color || '#C98B4A'; ctx.fillRect(-s / 2, -s / 2, s, s); break;
      }
      ctx.restore();
    }
  }
}

// ---- 05-sound.js
/* =========================================================================
   Sound — a tiny synthesizer: sfx, babbling voices, generative music.
   No audio files: every sound is built from oscillators and noise.
   ========================================================================= */
const Sound = (() => {
  let ctx = null, master, comp, musicBus, sfxBus, voiceBus, noiseBuf;
  let muted = store.get('muted', false);
  let track = null, wanted = null, pending = null, timer = null, nextT = 0, step = 0, lastVoice = 0;

  function init() {
    if (ctx) { if (ctx.state !== 'running' && ctx.state !== 'closed' && !document.hidden) ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { return; }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9;
    master.connect(comp); comp.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.42; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 1.0; sfxBus.connect(master);
    voiceBus = ctx.createGain(); voiceBus.gain.value = 0.5; voiceBus.connect(master);
    try { const sb = ctx.createBufferSource(); sb.buffer = ctx.createBuffer(1, 1, 22050); sb.connect(ctx.destination); sb.start(0); } catch (e) { /* ignore */ }
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) ctx.suspend().catch(() => {});
      else { if (ctx.state !== 'closed') ctx.resume().catch(() => {}); nextT = ctx.currentTime + 0.08; }
    });
    if (pending) { const p = pending; pending = null; music(p); }
  }
  const ok = () => ctx && ctx.state === 'running' && !muted;

  function env(g, at, a, peak, d) {
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), at + a);
    g.gain.exponentialRampToValueAtTime(0.0001, at + a + d);
  }
  function tone(o) {
    const at = o.at != null ? o.at : ctx.currentTime + (o.t || 0);
    const a = o.a || 0.005, dur = o.dur || 0.2;
    const osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, at);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, at + a + dur);
    const g = ctx.createGain();
    env(g, at, a, o.vol || 0.2, dur);
    let node = osc;
    if (o.filter) {
      const fl = ctx.createBiquadFilter();

/* =========================================================================
   Studio — the drawing pad

const Studio = (() => {
  let cv, ctx, size = 300, dpr = 1;

  function setup() {
    if (built) return;

    cv = $('#pad'); ctx = cv.getContext('2d');
    const sw = $('#swatches');
    COLORS.forEach((c, i) => {
      const b = h('button', { class: 'swatch', role: 'radio', 'aria-checked': i === color ? 'true' : 'false', 'aria-label': c.name, style: `background:${c.fill}` });
      b.addEventListener('click', () => { color = i; for (const x of $$('.swatch', sw)) x.setAttribute('aria-checked', x === b ? 'true' : 'false'); Sound.sfx('tap'); render(); });
      sw.append(b);
    });
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    $('#draw-undo').addEventListener('click', () => {
      if (anim) return;
      if (strokes.length) { const s = strokes.pop(); undo.push(s); if (s._pair && strokes.length) strokes.pop(); }
      else if (undo.cleared) { strokes = undo.cleared; undo.cleared = null; }
      Sound.sfx('swish'); changed();
    });
    $('#draw-clear').addEventListener('click', () => {
      if (anim || !strokes.length) return;
      undo = []; undo.cleared = strokes; strokes = []; Sound.sfx('poof'); changed();
    });
    $('#draw-surprise').addEventListener('click', surprise);
    $('#draw-mirror').addEventListener('click', () => {
      mirror = !mirror;
      $('#draw-mirror').setAttribute('aria-pressed', String(mirror));
      Sound.sfx('tap');
      if (mirror) toast('Mirror on: draw one side, get both');
      render();
    });
    $('#prompt-roll').addEventListener('click', () => { rollPrompt(); Sound.sfx('tap'); });
    $('#draw-back').addEventListener('click', () => { close(); if (onDone) onDone(null); });
    $('#draw-done').addEventListener('click', finish);
    window.addEventListener('resize', () => { if (!$('#draw').hidden) fit(); });
    document.addEventListener('keydown', (e) => {
      if ($('#draw').hidden) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); $('#draw-undo').click(); }
      if (e.key === 'Escape') $('#draw-back').click();

  }
  function rollPrompt() {
    const cur0 = $('#prompt-text').textContent;
    let p = rand.pick(TXT.prompts);
    if (p === cur0) p = rand.pick(TXT.prompts);
    $('#prompt-text').textContent = p;
  }
  function open(cb) {
    setup();
    onDone = cb;
    strokes = []; undo = []; cur = null; preview = null;
    color = rand.int(0, 7);
    for (const [i, x] of $$('.swatch').entries()) x.setAttribute('aria-checked', i === color ? 'true' : 'false');
    rollPrompt();
    $('#draw').hidden = false;
    fit();
    changed();
  }
  function close() { $('#draw').hidden = true; cancelAnim(); }

    const wrap = $('#pad-wrap');
    const avail = $('.studio-inner').clientWidth;
    const land = window.innerHeight <= 520 && window.innerWidth >= 640;
    const outer = Math.max(200, Math.floor(land ? Math.min(window.innerHeight - 96, avail * 0.55) : Math.min(avail, 560, window.innerHeight - 318)));

    size = Math.max(100, wrap.clientWidth);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
    render();
  }
  const toDraw = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * DRAW, ((e.clientY - r.top) / r.height) * DRAW]; };
  function down(e) {
    if (anim || pid !== null) return;
    if (e.button != null && e.button > 0) return;

        cur.push(clamp(x, 0, DRAW), clamp(y, 0, DRAW));

  function up(e) {

    const step = DRAW / 16;
    ctx.beginPath();
    for (let i = 1; i < 16; i++) { const p = Math.round(i * step * k) + 0.5; ctx.moveTo(p, 0); ctx.lineTo(p, cv.height); ctx.moveTo(0, p); ctx.lineTo(cv.width, p); }

    ctx.setTransform(k, 0, 0, k, 0, 0);
    if (mirror) {
      ctx.save(); ctx.setLineDash([10, 10]); ctx.strokeStyle = '#B69CFF'; ctx.lineWidth = 3;

    }
    if (preview) {
      ctx.fillStyle = COLORS[color].fill;
      ctx.beginPath();

      if (s.length > 2) ctx.lineTo(s[s.length - 2], s[s.length - 1]);
      ctx.stroke();
    }
  }
  function cancelAnim() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } }
  function surprise() {
    if (anim) return;
    Sound.init();
    const target = randomDoodle((Math.random() * 1e9) >>> 0);
    strokes = []; undo = [];
    $('#pad-hint').style.opacity = 0;
    const total = target.reduce((n, s) => n + s.length / 2, 0);
    const perSec = Math.max(total / 0.9, 60);
    const t0 = performance.now();

    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;

/* =========================================================================
   Race — "Daily Dash". Deterministic 60 Hz simulation: a run is just a list
   of (press frame, hold frames), so ghosts replay exactly on any device.
   ========================================================================= */
const RACE_HZ = 60, DT = 1 / RACE_HZ;
const HURDLE = { low: 45, high: 92 };
const RIVAL_SKILL = { 'local-beans': 0.25, 'local-gloria': 0.55, 'local-steve': 0.6, 'local-wobble': 0.85 };

function genTrack(seed) {
  const r = makeRng(seed);
  const L = 6000;
  const obs = [];
  let x = 700;
  while (x < L - 450) {
    const p = r(), diff = x / L;
    if (p < 0.33) obs.push({ t: 'low', x });
    else if (p < 0.55) obs.push({ t: 'high', x });
    else if (p < 0.66) { obs.push({ t: 'low', x }); x += 175 + r.int(0, 35); obs.push({ t: 'low', x }); }
    else if (p < 0.79) obs.push({ t: 'mud', x, w: 150 + r.int(0, 30) });
    else if (p < 0.9) obs.push({ t: 'boost', x, w: 70 });
    else obs.push({ t: 'spring', x, w: 44 });
    x += Math.round(lerp(470, 310, diff)) + r.int(0, 120);
  }
  for (const o of obs) if (!o.w) o.w = 12;
  return { L, obs, seed };
}

function makeRacer(rec, idx, track, kind, extra = {}) {
  const g = buildGuy(rec);
  const st = g.stats;
  const r = {
    rec, g, idx, kind, ...extra,
    x: 0, y: 0, vx: 0, vy: 0, holdT: 0, buffer: 0, tumble: 0, boost: 0, zoom: 0,
    vmax: 300 * (0.95 + 0.01 * st.spd),
    acc: 560 * (1.06 - 0.012 * st.hft),
    jv: 640 * (0.96 + 0.008 * st.hop),
    keep: 0.32 + 0.025 * st.hft,
    chaos: st.chs,
    rng: makeRng(hashInts(track.seed, rec.seed, 7)),
    finished: false, timeMs: 0, oi: 0, log: [], hits: 0,
    down: track.obs.map(() => false), used: track.obs.map(() => false),
    inputs: [], pressAt: -1, held: false, pressed: false, ghostI: 0,
    P: makePose(), dist: 0, events: [],
  };
  r.P.face = 1; r.P.armMode = 'run'; setExpr(r.P, 'determined');
  r.P.pupils = g.eyes.map(() => ({ x: 0.3, y: 0, vx: 0, vy: 0 }));
  return r;
}

function aiInput(r, track, frame) {
  // decide presses for an upcoming obstacle once, deterministically
  if (r.plan && frame >= r.plan.at + r.plan.hold + 1) r.plan = null;
  if (!r.plan) {
    let next = null;
    for (let i = r.oi; i < track.obs.length; i++) { const o = track.obs[i]; if (o.x + o.w > r.x && o.t !== 'boost' && o.t !== 'spring') { next = o; break; } }
    if (next && !next.aiDone) next.aiDone = {};
    if (next && !next.aiDone[r.idx] && r.y <= 0) {
      const v = Math.max(r.vx, 120);
      const skill = r.skill;
      const lead = next.t === 'low' ? v * 0.22 : next.t === 'high' ? v * 0.27 : 8;
      const errF = Math.round((r.rng() * 2 - 1) * lerp(9, 1.5, skill));
      const dist = next.x - (r.x + 16);
      if (dist <= lead + errF * v * DT) {
        next.aiDone[r.idx] = true;
        const fumble = r.rng() < lerp(0.3, 0.02, skill);
        const hold = next.t === 'low' ? 0 : next.t === 'high' ? 16 : 18;
        r.plan = { at: frame, hold: fumble ? (hold ? 0 : 16) : hold };
      }
    }
  }
  if (r.plan) return { pressed: frame === r.plan.at, held: frame < r.plan.at + r.plan.hold };
  return { pressed: false, held: false };
}

function ghostInput(r, frame) {
  const ins = r.ghost.inputs;
  let pressed = false, held = false;
  while (r.ghostI < ins.length && ins[r.ghostI] < frame) r.ghostI += 2;
  if (r.ghostI < ins.length && ins[r.ghostI] === frame) pressed = true;
  for (let i = Math.max(0, r.ghostI - 6); i < Math.min(ins.length, r.ghostI + 2); i += 2) if (frame >= ins[i] && frame < ins[i] + ins[i + 1]) held = true;

}

      for (let ci = 0; ci < inRow; ci++, idx++) {
        const { rec, g } = list[idx];
        const x = 40 + cellW * (ci + 0.5) + (cols - inRow) * cellW * 0.5;
        const s = Math.min((rowH * 0.92 * k) / (g.fullH + 20), (cellW * 0.96) / (g.halfW * 2 + 30));
        const P = makePose(); P.blinkT = 99; P.pupils = g.eyes.map(() => ({ x: 0, y: 0.05 }));
        if ((hashString(rec.id) % 3) === 0) { setExpr(P, 'happy'); }
        if (g.arms.length && (hashString(rec.id) % 2)) P.armMode = 'cheer';
        drawGuy(c, g, x, gy, s, P, 0.1, { crown: rec.crown });
        drawTag(c, rec.name, x, gy + 20, 0.92, Math.max(14, Math.min(24, cellW * 0.09)));
      }
    }
    c.lineWidth = 12; c.strokeStyle = INK; c.strokeRect(6, 6, Wd - 12, Hd - 12);
    return cv;
  }

              `Reply in character: one or two short sentences, all lowercase, funny, sweet and a little absurd, under 35 words. At most one emoji. Keep it wholesome. Never mention being an AI.`;

  function startRace(mode, racerId, opts = {}) {
    if (needGuys()) return;
    if (Yard.dancing) Yard.endDance();
    const me = Zoo.get(racerId) || Zoo.list()[0];
    let day = localDayIndex(), seed;
    const racers = [];
    if (mode === 'party') {
      seed = (Math.random() * 1e9) >>> 0;
      opts.picks.forEach((id, i) => racers.push({ rec: Zoo.get(id) || me, kind: 'human', player: i }));
    } else {
      if (mode === 'daily') {
        if (opts.ghost) day = opts.ghost.day;
        seed = hashInts(day, 777, 1);
        const order = ['local-beans', 'local-gloria', 'local-wobble', 'local-steve'];
        let rivals = order.map((id) => Zoo.locals().find((r) => r.id === id)).filter((r) => r && r.id !== me.id).slice(0, 3);
        rivals.sort((a, b) => (RIVAL_SKILL[a.id] || 0) - (RIVAL_SKILL[b.id] || 0));
        if (opts.ghost) rivals.shift();
        for (const r of rivals) racers.push({ rec: r, kind: 'ai', skill: RIVAL_SKILL[r.id] || 0.6 });
        if (opts.ghost) racers.push({ rec: opts.ghost.rec, kind: 'ghost', ghost: opts.ghost, label: 'Ghost · ' + opts.ghost.rec.name });
        const pb = dashData()[day];
        const pbRec = pb && pb.inputs && pb.inputs.length ? Zoo.get(pb.id) : null;
        if (pbRec) racers.push({ rec: pbRec, kind: 'pb', ghost: { inputs: pb.inputs } });
      } else {
        seed = (Math.random() * 1e9) >>> 0;
        const pool = Zoo.list().filter((r) => r.id !== me.id);
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        for (const r of pool.slice(0, 3)) racers.push({ rec: r, kind: 'ai', skill: rand.range(0.35, 0.8) });
      }
      racers.push({ rec: me, kind: 'human', player: 0 });
    }
    show('race');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    Race.start({ mode, seed, day, racers }, (res) => setTimeout(() => results(res, opts), 300));
  }

  function results(res, opts) {
    const mode = res.mode;
    const humansR = res.results.filter((r) => r.kind === 'human');
    const me = humansR[0];
    let pb = false, crown = false;
    for (const hr of humansR) { const zr = Zoo.get(hr.rec.id); Zoo.bump(zr, 'races'); if (hr.place === 1) Zoo.bump(zr, 'wins'); }
    if (mode === 'daily' && me && !me.dnf) {
      const all = dashData();
      const prev = all[res.day];
      if (!prev || me.timeMs < prev.ms) { all[res.day] = { ms: me.timeMs, inputs: me.inputs, id: me.rec.id, place: me.place }; store.set('dash', all); pb = !!prev; }
      if (me.place === 1 && !me.rec.crown) {
        const rec = Zoo.get(me.rec.id);
        if (rec) { rec.crown = 1; Zoo.update(rec); crown = true; Yard.sync(Zoo.list()); }
      }
    }
    const emoji = (log) => res.track.obs.map((o, i) => {
      const v = log[i];
      if (o.t === 'boost') return v === 'boost' ? '⚡' : '';
      if (o.t === 'spring') return v === 'spring' ? '🍄' : '';
      return v === 'hit' ? '🟥' : '🟩';
    }).join('');
    const medal = (pl) => (pl === 1 ? '🥇' : pl === 2 ? '🥈' : pl === 3 ? '🥉' : '🏃');
    modal((p) => {
      if (mode === 'party') {
        const win = humansR[0];
        p.append(h('h2', { id: 'modal-h', text: 'P' + (win.player + 1) + ' wins!' }), h('p', { text: win.rec.name + ' crossed first in ' + fmtTime(win.timeMs) + 's.' }));
      } else {
        p.append(h('h2', { id: 'modal-h', text: me.place === 1 ? 'You won!' : ordinal(me.place) + ' place' }));
        const tl = h('div', { class: 'big-time', text: fmtTime(me.timeMs) + 's' });
        if (pb) tl.append(h('span', { class: 'pb', text: 'new best' }));
        p.append(tl);
        if (crown) p.append(h('p', { text: '👑 ' + me.rec.name + ' earned a crown. It shows up in the yard.' }));
      }
      const list = h('div', { role: 'list' });
      for (const r of res.results) {
        const who = r.kind === 'human' ? (mode === 'party' ? 'P' + (r.player + 1) + ' · ' + r.rec.name : r.rec.name + ' (you)') : (r.label || r.rec.name);
        list.append(h('div', { class: 'podium-line' + (r === me && mode !== 'party' ? ' me' : ''), role: 'listitem' }, h('span', { class: 'place', text: medal(r.place) }), h('span', { text: who }), h('span', { class: 't', text: r.dnf ? 'DNF' : fmtTime(r.timeMs) + 's' })));
      }
      p.append(list);
      let shareText = '';
      if (mode === 'daily' && me) {
        const dn = Math.max(1, res.day - EPOCH_DAY + 1);
        shareText = `Weird Little Guys · Daily Dash #${dn}\n${medal(me.place)} ${me.rec.name} — ${fmtTime(me.timeMs)}s\n${emoji(me.log)}`;
        const link = !inArtifactViewer && location.protocol !== 'file:' ? location.href.split('#')[0] : '';
        if (link) shareText += '\n' + link;
        p.append(h('pre', { class: 'result-share', text: shareText }));
      }
      const row = h('div', { class: 'row' });
      if (shareText) row.append(h('button', { class: 'btn primary', type: 'button', 'data-icon': 'copy', text: 'Copy result', onclick: async () => { if (await copyText(shareText, p.querySelector('.result-share'))) toast('Copied. Brag responsibly'); else toast('Select the result text and copy it'); } }));
      if (mode === 'daily' && me && !me.dnf) row.append(h('button', { class: 'btn blue', type: 'button', 'data-icon': 'mail', text: 'Challenge a friend', onclick: () => challenge(me, res.day) }));
      p.append(row);
      p.append(h('div', { class: 'row' },
        h('button', { class: 'btn go', type: 'button', 'data-icon': 'flag', text: 'Race again', onclick: () => { closeModal(); if (mode === 'party') startRace('party', null, opts); else startRace(mode, me.rec.id, opts); } }),
        h('button', { class: 'btn', type: 'button', 'data-icon': 'house', text: 'Yard', onclick: () => { closeModal(); show('yard'); } })));
    }, { onClose: () => { if (screen === 'race' && !Race.active) show('yard'); else if (screen === 'race' && Race.phase === 'done') show('yard'); } });
  }
  function challenge(me, day) {
    const code = Codec.raceCode(me.rec, { day, ms: me.timeMs, inputs: me.inputs });
    const link = Codec.shareLink(code);
    const msg = link
      ? `I ran Daily Dash #${Math.max(1, day - EPOCH_DAY + 1)} in ${fmtTime(me.timeMs)}s with ${me.rec.name}. Race my ghost: ${link}`
      : `I ran Daily Dash #${Math.max(1, day - EPOCH_DAY + 1)} in ${fmtTime(me.timeMs)}s with ${me.rec.name}. Open Weird Little Guys, tap "Got a code from a friend?" and paste this to race my ghost:\n${code}`;
    modal((p) => {
      p.append(h('h2', { id: 'modal-h', text: 'Challenge a friend' }), h('p', { text: 'Your friend races your exact run as a ghost, on the same track. ' + me.rec.name + ' moves into their yard too.' }));
      const box = h('textarea', { class: 'codebox', readonly: true, rows: 4, 'aria-label': 'Challenge message' });
      box.value = msg;
      p.append(box, h('div', { class: 'row' }, h('button', { class: 'btn primary', type: 'button', 'data-icon': 'copy', 'data-autofocus': true, text: 'Copy challenge', onclick: async () => { if (await copyText(msg, box)) toast('Copied. Now send it'); } })));
    }, { onClose: () => show('yard') });
  }

  /* ---------- wiring ---------- */
  function init() {
    setupNamer();
    setupCard();
    $('#t-draw').addEventListener('click', newGuy);
    $('#t-yard').addEventListener('click', () => show('yard'));
    $('#t-dash').addEventListener('click', () => { show('yard'); raceMenu(); });
    $('#t-party').addEventListener('click', () => { show('yard'); partyMenu(); });
    $('#t-adopt').addEventListener('click', () => adopt());
    $('#t-about').addEventListener('click', about);
    $('#yt-home').addEventListener('click', () => show('title'));
    $('#yb-draw').addEventListener('click', newGuy);
    $('#yb-snack').addEventListener('click', () => { Yard.snackShower(); hint('Tip: tap anywhere on the grass to drop a snack right there.', 3500); });
    $('#yb-race').addEventListener('click', () => raceMenu());
    const menu = $('#yard-menu');
    $('#yb-more').addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; $('#yb-more').setAttribute('aria-expanded', String(!menu.hidden)); });
    document.addEventListener('pointerdown', (e) => { if (!menu.hidden && !menu.contains(e.target) && e.target.closest('#yb-more') == null) { menu.hidden = true; $('#yb-more').setAttribute('aria-expanded', 'false'); } });
    const mi = (id, fn) => $(id).addEventListener('click', () => { menu.hidden = true; $('#yb-more').setAttribute('aria-expanded', 'false'); fn(); });
    mi('#ym-adopt', () => adopt());
    mi('#ym-party', partyMenu);
    mi('#ym-photo', showGroupPhoto);
    mi('#ym-dance', () => { if (Yard.dancing) Yard.endDance(); else { Yard.startDance(); toast('Dance party!'); } });
    mi('#ym-about', about);
    mi('#ym-home', () => show('title'));
    for (const id of ['#yt-sound', '#hud-sound', '#t-sound']) $(id).addEventListener('click', () => { Sound.setMuted(!Sound.isMuted()); soundIcons(); if (!Sound.isMuted()) Sound.music(screen === 'race' ? 'race' : Yard.isNight ? 'night' : 'yard'); });
    $('#hud-back').addEventListener('click', () => { Race.stop(); show('yard'); });
    $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!$('#modal').hidden) closeModal();
      else if (!$('#card').hidden) closeCard();
    });
    soundIcons();
    Yard.hooks.openCard = (a) => openCard(a);
  }
  return { init, show, receive, adopt, openCard, caps, get screen() { return screen; }, raceMenu, hint };
})();

// ---- 10-main.js
/* =========================================================================
   Main — boot, loop, input routing
   ========================================================================= */
(function main() {
  const cv = $('#world');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, last = performance.now();

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    Yard.resize(W, H);
    Race.resize(W, H);
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (Race.active && UI.screen === 'race') {
      Race.update(dt);
      Race.draw(ctx);
    } else {
      Yard.update(dt);
      Yard.draw(ctx);
    }
    requestAnimationFrame(frame);
  }

  // input routing
  const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, pointerId: e.pointerId }; };
  cv.addEventListener('pointerdown', (e) => {
    Sound.init();
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (Race.active && UI.screen === 'race') { e.preventDefault(); Race.pointerDown(pt(e)); return; }
    cv.classList.add('dragging');
    Yard.pointerDown(pt(e));
  });
  cv.addEventListener('pointermove', (e) => { if (!(Race.active && UI.screen === 'race')) Yard.pointerMove(pt(e)); });
  const up = (e) => {
    cv.classList.remove('dragging');
    if (Race.active && UI.screen === 'race') { Race.pointerUp(pt(e)); return; }
    Yard.pointerUp(pt(e));
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('lostpointercapture', up);
  cv.addEventListener('pointerleave', () => Yard.pointerLeave());
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if (Race.active && UI.screen === 'race' && $('#modal').hidden) { if (Race.key(e, true)) e.preventDefault(); }
  });
  document.addEventListener('keyup', (e) => { if (Race.active && UI.screen === 'race') Race.key(e, false); });
  const unlock = () => { Sound.init(); };
  for (const ev of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, unlock, { capture: true });

  // boot
  hydrateIcons();
  UI.init();
  resize();
  Yard.sync(Zoo.list());
  UI.show('title');
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); }).catch(() => {});
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });

  // incoming invite (standalone hosting: #g=... / #r=...)
  function checkHash() {
    const hsh = location.hash;
    if (!/^#[gr]=/.test(hsh)) return;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ }
    const res = Codec.parse(hsh);
    if (res) setTimeout(() => UI.receive(res), 400);
    else setTimeout(() => toast('That invite link looks broken. Ask your friend to copy it again.', 3500), 400);
  }
  checkHash();
  window.addEventListener('hashchange', checkHash);
  // paste a code anywhere outside a text field
  document.addEventListener('paste', (e) => {
    if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;
    const text = (e.clipboardData && e.clipboardData.getData('text')) || '';
    const res = Codec.parse(text);
    if (res) { e.preventDefault(); UI.receive(res); }
  });

  // optional runtime capabilities, only present when an embedding host provides them
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((d) => { UI.caps.downloads = d; }).catch(() => {});
    window.claude.use('sample').then((s) => { UI.caps.sample = s; }).catch(() => {});
  }
  window.__wlg = { Yard, Race, Zoo, UI, Sound, Codec, buildGuy, randomDoodle, newRecord };
})();


})();
</script>
